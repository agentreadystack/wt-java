name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/wt-java install.sh test/test.sh
  test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WT_JAVA_TEST_PG: "1"
      WT_JAVA_TEST_REDIS: "1"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client redis-tools
      - run: ./test/test.sh
      - name: integration tests must not have been skipped
        run: ./test/test.sh | tee out.txt && ! grep -q '^skip' out.txt
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/test.sh
